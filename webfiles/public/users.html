<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - DevOps Demo Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">DevOps Demo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link active" href="users.html">Users</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1>Users</h1>
        <p class="lead">Loaded live from the <code>/users</code> endpoint served by json-server.</p>

        <div id="status" class="alert alert-secondary" role="alert">Loading users&hellip;</div>

        <div class="table-responsive d-none" id="tableWrapper">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Active</th>
                    </tr>
                </thead>
                <tbody id="userRows"></tbody>
            </table>
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 DevOps Demo Site</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const status = document.getElementById('status');
        const wrapper = document.getElementById('tableWrapper');
        const rows = document.getElementById('userRows');

        function cell(text) {
            const td = document.createElement('td');
            td.textContent = text;
            return td;
        }

        function badge(active) {
            const td = document.createElement('td');
            const span = document.createElement('span');
            span.className = active ? 'badge text-bg-success' : 'badge text-bg-secondary';
            span.textContent = active ? 'Active' : 'Inactive';
            td.appendChild(span);
            return td;
        }

        fetch('/users')
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('Request failed with status ' + response.status);
                }
                return response.json();
            })
            .then(function (users) {
                if (!users.length) {
                    status.className = 'alert alert-warning';
                    status.textContent = 'No users were returned.';
                    return;
                }
                users.forEach(function (user) {
                    const tr = document.createElement('tr');
                    tr.appendChild(cell(user.id));
                    tr.appendChild(cell(user.name));
                    tr.appendChild(cell(user.email));
                    tr.appendChild(badge(user.active));
                    rows.appendChild(tr);
                });
                status.classList.add('d-none');
                wrapper.classList.remove('d-none');
            })
            .catch(function (error) {
                status.className = 'alert alert-danger';
                status.textContent = 'Could not load users: ' + error.message;
            });
    </script>
</body>
</html>
