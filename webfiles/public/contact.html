<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - DevOps Demo Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">DevOps Demo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1>Contact</h1>
        <p class="lead">Placeholder contact details and form.</p>

        <div class="row g-5 mt-1">
            <div class="col-md-7">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Your message"></textarea>
                    </div>
                    <button type="button" class="btn btn-primary">Send</button>
                </form>
                <p class="text-muted small mt-3">This form is a placeholder and does not submit anywhere.</p>
            </div>
            <div class="col-md-5">
                <img src="https://picsum.photos/seed/office/600/400" class="img-fluid rounded mb-3" alt="Placeholder">
                <h5>Find us</h5>
                <p class="mb-1">123 Placeholder Street</p>
                <p class="mb-1">Dublin, Ireland</p>
                <p class="mb-0">hello@example.com</p>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 DevOps Demo Site</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
