<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Infinite Runner">
  <rect width="600" height="360" fill="#111"/>

  <!-- clouds -->
  <g fill="rgba(255,255,255,.10)">
    <rect x="80" y="70" width="70" height="12"/>
    <rect x="98" y="58" width="36" height="11"/>
    <rect x="330" y="46" width="70" height="12"/>
    <rect x="348" y="34" width="36" height="11"/>
    <rect x="470" y="96" width="54" height="10"/>
  </g>

  <!-- ground -->
  <rect x="0" y="276" width="600" height="3" fill="rgba(255,255,255,.35)"/>
  <g fill="rgba(255,255,255,.18)">
    <rect x="20" y="294" width="40" height="4"/>
    <rect x="96" y="294" width="22" height="4"/>
    <rect x="150" y="294" width="34" height="4"/>
    <rect x="228" y="294" width="18" height="4"/>
    <rect x="286" y="294" width="44" height="4"/>
    <rect x="372" y="294" width="26" height="4"/>
    <rect x="440" y="294" width="38" height="4"/>
    <rect x="520" y="294" width="20" height="4"/>
  </g>

  <!-- runner, mid-jump -->
  <g>
    <rect x="96" y="176" width="54" height="74" rx="4" fill="#42b642"/>
    <rect x="102" y="182" width="42" height="8" fill="rgba(255,255,255,.22)"/>
    <rect x="134" y="196" width="9" height="9" fill="#111"/>
    <rect x="104" y="244" width="15" height="14" rx="2" fill="#2f8a2f"/>
  </g>
  <!-- motion lines -->
  <g fill="rgba(66,182,66,.35)">
    <rect x="48" y="196" width="36" height="6" rx="3"/>
    <rect x="34" y="214" width="52" height="6" rx="3"/>
    <rect x="56" y="232" width="28" height="6" rx="3"/>
  </g>

  <!-- ground obstacles -->
  <g fill="#31c7ef">
    <rect x="300" y="216" width="30" height="60" rx="3"/>
    <rect x="348" y="236" width="22" height="40" rx="3"/>
    <rect x="492" y="226" width="26" height="50" rx="3"/>
  </g>
  <g fill="rgba(255,255,255,.2)">
    <rect x="305" y="221" width="20" height="7"/>
    <rect x="352" y="241" width="14" height="7"/>
    <rect x="497" y="231" width="16" height="7"/>
  </g>

  <!-- drone -->
  <g>
    <rect x="412" y="150" width="64" height="34" rx="4" fill="#ef2029"/>
    <rect x="424" y="138" width="40" height="7" rx="3" fill="rgba(255,255,255,.25)"/>
    <rect x="462" y="162" width="7" height="7" fill="#111"/>
  </g>
</svg>
