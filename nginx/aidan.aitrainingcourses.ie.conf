# Reference copy of /etc/nginx/sites-available/aidan.aitrainingcourses.ie on the training VM.
#
# This file is NOT deployed. `deploy.bat` only copies `webfiles`; nginx config lives on the VM
# and has to be put there by hand (or restored from this copy) after a rebuild:
#
#   scp nginx/aidan.aitrainingcourses.ie.conf claude@4.207.224.161:/tmp/
#   sudo mv /tmp/aidan.aitrainingcourses.ie.conf /etc/nginx/sites-available/aidan.aitrainingcourses.ie
#   sudo nginx -t && sudo systemctl reload nginx
#
# The htpasswd file it references is NOT in this repo and must be recreated separately:
#
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -bc /etc/nginx/.htpasswd class '<password>'
#   sudo chown root:www-data /etc/nginx/.htpasswd && sudo chmod 640 /etc/nginx/.htpasswd

server {

    server_name aidan.aitrainingcourses.ie;

    access_log /var/log/nginx/aidan-access.log;
    error_log /var/log/nginx/aidan-error.log;

    # Hoisted to server level so every location inherits them, including /private/.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Password-protected class materials. nginx challenges the request before it reaches
    # json-server, so the files are never sent to an unauthenticated browser. Pages only --
    # the /users API below stays public by design.
    location /private/ {
        auth_basic "Class materials";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aidan.aitrainingcourses.ie/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aidan.aitrainingcourses.ie/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = aidan.aitrainingcourses.ie) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name aidan.aitrainingcourses.ie;
    return 404; # managed by Certbot


}
